<!doctype html>
<html lang="pt-br">
<head>
    <script>
      try{localStorage.setItem('tourVisto_v1','1');}catch(e){}
      document.addEventListener('submit', function(e){
        var f = e.target;
        if (f && f.action && String(f.action).indexOf('login.html') !== -1 && !f.classList.contains('login-card')) {
          e.preventDefault();
          window.location.href = './login.html';
        }
      }, true);
    </script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUA MARCA · Vitrine do Balcão</title>
<link rel="icon" href="./static/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./static/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./static/img/logo-marca.svg">
<link rel="preload" href="./static/fonts/manrope-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./static/balcao.css?v=50396ea6">
    <link rel="stylesheet" href="./static/novos.css?v=291d3c7a">
    <script src="./static/marca.js?v=4d14148f"></script>
</head>
<body>
  <div class="screen-top">
    <div class="marca"><img src="./static/img/logo-marca.svg" alt="SUA MARCA" class="logo-pequeno"><span class="nome">SUA MARCA</span></div>
    <div class="topo-direita">
      <span class="atendente">Atendente: Carlos Eduardo (Proprietário)</span>
      <div id="relogio">--:--</div>
    </div>
  </div>

  <div class="corpo">
    <div class="ultimo-item" id="ultimoItem" hidden>
      
    </div>
    <div class="lista-wrap">
      <div class="lista-cabecalho"><span>Produto</span><span>Qtd</span><span>Unit.</span><span>Subtotal</span></div>
      <div id="listaItens">
        
      </div>
      <div class="tela-ociosa" id="telaOciosa"
           data-caixa-aberto="sim" >
        <img src="./static/img/logo-marca.svg" alt="SUA MARCA" class="logo-grande">
        <p class="vazio" id="vazioMsg">CAIXA LIVRE</p>
        <p class="boas-vindas" id="boasVindasMsg">Seja bem-vindo</p>
      </div>
    </div>

    <div class="status-processo" id="statusProcesso" hidden><span class="ponto"></span> <span id="statusTexto"></span></div>

    <div class="pix-qrcode-box" id="pixQrContainer" hidden></div>

    <div class="rodape">
      <div class="qtd-total"><b id="qtdItens">0</b> item(ns)</div>
      
      <div class="total-detalhe" id="totalDetalhe" hidden>
        <span class="linha"><span class="rotulo">Subtotal</span> <b id="subtotalVenda">R$ 0,00</b></span>
        <span class="linha desconto"><span class="rotulo">Desconto</span> <b id="descontoVenda">− R$ 0,00</b></span>
      </div>
      <div class="total">
        <span class="rotulo">Total</span>
        <span class="valor" id="totalVenda">R$ 0,00</span>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlayFim">
    <div class="check">✓</div>
    <h2>Obrigado pela preferência!</h2>
    <div class="valor-final" id="overlayValor">R$ 0,00</div>
  </div>

  <script src="./static/demo-pdv.js?v=ae78afbf"></script>
  <script src="./static/balcao.js?v=5139b706"></script>
</body>
</html>
